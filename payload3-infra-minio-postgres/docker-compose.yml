services:
  payload:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0

      # Use the Compose service name "postgres"
      DATABASE_URI: postgresql://payload:payload_password@postgres:5432/payload

      # If your application uses DATABASE_URL instead:
      DATABASE_URL: postgresql://payload:payload_password@postgres:5432/payload

      # Payload configuration
      PAYLOAD_SECRET: change-this-to-a-long-random-secret

      # MinIO / S3 configuration
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: payload
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadminpassword
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payload
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload_password

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payload -d payload"]
      interval: 5s
      timeout: 5s
      retries: 20

    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword

    volumes:
      - minio_data:/data

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:

